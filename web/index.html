<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="세트플로우 — 운동 기록부터 트레이너 코칭까지.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Setflow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Setflow</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    #boot-error {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: 24px;
      background: #FFFFFF;
      color: #111113;
      font-family: Arial, "Apple SD Gothic Neo", sans-serif;
      text-align: center;
    }

    #boot-error[hidden] {
      display: none;
    }

    .boot-error__panel {
      width: min(100%, 320px);
    }

    .boot-error__title {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 800;
    }

    .boot-error__message {
      margin: 0 0 24px;
      color: #626268;
      font-size: 14px;
      line-height: 1.55;
    }

    .boot-error__retry {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      background: #B7F500;
      color: #111113;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0B0B0C;
          }

      #boot-error {
        background: #0B0B0C;
        color: #F6F6F7;
      }

      .boot-error__message {
        color: #A6A6AD;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    function showFlutterBootstrapError(message) {
      removeSplashFromWeb();
      const error = document.getElementById("boot-error");
      const detail = document.getElementById("boot-error-message");
      if (detail && message) detail.textContent = message;
      if (error) error.hidden = false;
    }

    function finishFlutterBootstrap() {
      removeSplashFromWeb();
      document.getElementById("boot-error")?.remove();
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>

  <section id="boot-error" role="alert" aria-live="assertive" hidden>
    <div class="boot-error__panel">
      <h1 class="boot-error__title">앱을 시작하지 못했어요</h1>
      <p id="boot-error-message" class="boot-error__message">
        네트워크 연결을 확인한 뒤 다시 시도해주세요.
      </p>
      <button
        class="boot-error__retry"
        type="button"
        onclick="window.location.reload()"
      >
        다시 시도
      </button>
    </div>
  </section>
  
  
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
