name: Verify

# The release workflow also analyzes and tests, but it only runs on push to
# main -- by then a broken change is already merged. This gate runs on the pull
# request, which is the only moment where "no" is cheap.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer commit on the same branch makes the previous run pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with android-distribute.yml, or the gate stops predicting the
  # release build.
  FLUTTER_VERSION: '3.44.7'

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android host
        run: flutter build apk --debug
      - name: Native notification and durable recording tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare unsigned iOS app and extension build
        run: flutter build ios --simulator --debug --no-codesign --config-only
      - name: Test durable iOS recording on a simulator
        timeout-minutes: 20
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(v["udid"] for group in d["devices"].values() for v in group if v.get("isAvailable") and v["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "id=$SIMULATOR_ID" -destination-timeout 120 -derivedDataPath build/ios-native-tests -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 120 -resultBundlePath build/ios-native-tests/Result.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee .dart_tool/ios-lockscreen-tests.log
      - name: Preserve iOS native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-recording-diagnostics
          path: |
            .dart_tool/ios-lockscreen-tests.log
            build/ios-native-tests/Result.xcresult
          retention-days: 7
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      # Called out separately from the suite so a boundary violation reads as
      # "architecture rule broken" in the checks list rather than hiding among
      # a few hundred passing widget tests. See docs/backend-portability.md.
      - name: Architecture rules
        run: flutter test test/architecture_test.dart

      - name: Test
        run: flutter test

      - name: Set up Node for database security checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Database security checks
        run: |
          npm install --prefix .dart_tool/workspace-security --no-audit --no-fund @electric-sql/pglite@0.5.8
          node tool/test_workspace_access.mjs
          node tool/test_account_profiles.mjs
          node tool/test_coaching_management.mjs
          node tool/test_consultation_chat.mjs
          node test/gym_directory_requests_security.mjs
          node --experimental-strip-types tool/test_push_message.mjs

      - name: Gym directory import checks
        run: python3 tool/test_import_gym_directory.py

      # The app also ships as a web bundle on Vercel. Dart that compiles for
      # mobile can still fail here (dart:io, platform channels), and Vercel
      # would be the first to find out — which is too late.
      - name: Build web
        run: flutter build web --release
